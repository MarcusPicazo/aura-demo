<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Título, favicon, descripción y etiquetas Open Graph/Twitter Card se inyectan aquí
         en build (ver el plugin `clientMetaPlugin` en vite.config.ts) a partir de
         src/config/aura.json — nunca fijos en este archivo, para que cambiar de cliente
         sea solo cambiar el JSON. La conexión anticipada a Supabase y la precarga del
         código del edificio salen del plugin `clientPreloadPlugin`. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Tipografía del sitio público. Se pide sin bloquear el primer pintado (`preload` + `onload`): la pantalla de arranque ya
         usa tipografías del sistema como respaldo y `display=swap` cambia a estas cuando llegan. Una hoja de estilos normal
         detiene el pintado hasta bajar, que con mal wifi eran segundos de pantalla en blanco.
         La del portal (Plus Jakarta Sans, Material Symbols) se carga solo al entrar al portal: `src/portal/lib/portalFonts.ts`. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
