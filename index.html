<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Título, favicon, descripción y etiquetas Open Graph/Twitter Card se inyectan aquí
         en build (ver el plugin `clientMetaPlugin` en vite.config.ts) a partir de
         src/config/aura.json — nunca fijos en este archivo, para que cambiar de cliente
         sea solo cambiar el JSON. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Portal comercial (src/portal/): tipografía editorial + iconografía propias, sin
         tocar las de arriba (motor 3D público). Cargadas siempre porque el portal es
         privado y de uso diario del equipo de ventas — el peso extra nunca lo paga un
         prospecto en el selector público. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
